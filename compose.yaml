services:
  app:
    build: ./docker/php
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy   # DBが接続を受け付けるまで待つ

  web:
    # TODO: Docker Hubで最新の安定版タグを確認し、バージョンを固定する（例: nginx:1.xx-alpine）
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
